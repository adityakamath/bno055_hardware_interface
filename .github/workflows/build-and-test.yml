name: build-and-test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distribution: [jazzy]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      # libi2c-dev provides <i2c/smbus.h> for src/bno055_i2c.c - it's a plain Debian package,
      # not a registered rosdep key, so rosdep would fail trying to resolve it on its own.
      # Installed manually here; rosdep-skip-keys tells action-ros-ci not to try.
      - name: Install libi2c-dev
        run: sudo apt-get update && sudo apt-get install -y libi2c-dev

      # test_hardware_interface (gtest) and test_bno055.launch.py both fall back to
      # enable_mock_mode:=true when no physical BNO055 is present, so the full suite runs
      # here the same way it would against real hardware. ament_lint_auto's cpplint/
      # uncrustify/cppcheck/xmllint/copyright checks run alongside them via colcon test;
      # clang-tidy's own static analysis stays in its separate workflow.
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: bno055_hardware_interface
          target-ros2-distro: ${{ matrix.ros_distribution }}
          rosdep-skip-keys: libi2c-dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs-${{ matrix.ros_distribution }}
          path: ros_ws/log
